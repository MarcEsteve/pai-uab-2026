<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAI UAB 2026</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5e6b75;
      --paper: #f6f3ed;
      --accent: #e75b38;
      --accent-dark: #ba3d20;
      --line: rgba(23, 32, 42, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background:
        linear-gradient(135deg, rgba(231, 91, 56, .12), transparent 42%),
        var(--paper);
    }

    main {
      width: min(760px, 100%);
      padding: clamp(32px, 7vw, 72px);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .58);
      box-shadow: 16px 18px 0 rgba(23, 32, 42, .08);
    }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--accent-dark);
      font: 700 .78rem/1.2 Arial, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 600px;
      margin: 0;
      font-size: clamp(3rem, 9vw, 6.6rem);
      line-height: .88;
      letter-spacing: -.04em;
    }

    p {
      max-width: 520px;
      margin: 28px 0 34px;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1.55;
    }

    button {
      border: 0;
      padding: 14px 20px;
      color: #fff;
      background: var(--accent);
      font: 700 .95rem Arial, sans-serif;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    button:hover,
    button:focus-visible {
      background: var(--accent-dark);
      transform: translateY(-3px);
    }

    #missatge {
      min-height: 1.5em;
      margin: 18px 0 0;
      color: var(--accent-dark);
      font: 700 .95rem Arial, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Programació d'Aplicacions a Internet</p>
    <h1>Hola, UAB.</h1>
    <p>Una pàgina inicial ràpida per començar el projecte PAI 2026. El codi és tot en un sol fitxer perquè puguis iterar sense fricció.</p>
    <button id="accio" type="button">Fes clic</button>
    <p id="missatge" aria-live="polite"></p>
  </main>

  <script>
    const boto = document.querySelector('#accio');
    const missatge = document.querySelector('#missatge');

    boto.addEventListener('click', () => {
      missatge.textContent = 'Ja funciona. Ara toca construir!';
    });
  </script>
</body>
</html>
