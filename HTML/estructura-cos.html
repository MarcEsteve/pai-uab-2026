<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estructura del cos</title>
  <link rel="stylesheet" href="estructura-cos.css">
</head>
<body>
  <header>
    <h1>La meva pàgina</h1>
    <p>Aquest és el cap de la pàgina.</p>
  </header>
  <nav>
    <a href="#inici">Inici</a>
    <a href="#noticia">Notícia</a>
  </nav>
  <main>
    <section id="inici">
      <h2>Inici</h2>
      <p>Aquesta és una secció de la pàgina.</p>
    </section>
    <article id="noticia">
      <h2>Una notícia</h2>
      <p>Aquest és un article independent.</p>
    </article>
    <aside>
      <h2>Informació extra</h2>
      <p>Aquest contingut és secundari.</p>
    </aside>
  </main>
  <footer>
    <p>Peu de pàgina - 2026</p>
  </footer>
</body>
</html>
